name: Java CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Maven test selector, e.g. -Dtest=FooTest (empty = full suite)'
        required: false
        default: ''

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        java: [ '8', '11', '17' ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3.5.3
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v3
        with:
          distribution: adopt
          java-version: ${{ matrix.java }}
          cache: maven
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Build with Maven on Java ${{ matrix.java }}
        if: matrix.java != '17'
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn -B -V test --no-transfer-progress -Dtest="$(echo '${{ inputs.test-filter }}' | tr ' ' ',')" -Dsurefire.failIfNoSpecifiedTests=false
          else
            mvn -B -V test --no-transfer-progress
          fi
      - name: Code coverage
        if: matrix.java == '17'
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn -B -V -Pcoverage verify --no-transfer-progress -Dtest="$(echo '${{ inputs.test-filter }}' | tr ' ' ',')" -Dsurefire.failIfNoSpecifiedTests=false
          else
            mvn -B -V -Pcoverage verify --no-transfer-progress
          fi
      - name: Package jar
        if: matrix.java == '8'
        run: mvn -B -V -DskipTests=true package --no-transfer-progress
      - name: Upload jar
        if: matrix.java == '8'
        uses: actions/upload-artifact@v4
        with:
          name: ognl-jar
          path: |
            target/ognl-*.jar
            !target/ognl-*-sources.jar
            !target/ognl-*-javadoc.jar
          if-no-files-found: error
      - name: Deploy SNAPSHOT
        if: false
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
        run: mvn -B -V -DskipTests=true deploy --no-transfer-progress
      - name: Apply automerge label
        if: matrix.java == '17' && github.actor == 'dependabot[bot]'
        run: gh pr edit "$PR_URL" --add-label "automerge"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
      - name: Automerge
        if: matrix.java == '17' && github.actor == 'dependabot[bot]'
        run: gh pr merge -m "$PR_URL"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
